    geo_json_6e652696b10bfb50b7b360bc7c7344d1.bindTooltip(
    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["pred_teks", "conf_str", "label_teks", "status_str", "NDVI_str", "NDWI_str", "NDBI_str"];
    let aliases = ["Hasil Klasifikasi:", "Keyakinan Model:", "Kelas Ground Truth:", "Status Validasi:", "NDVI:", "NDWI:", "NDBI:"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
    ,{
  "sticky": false,
  "className": "foliumtooltip",
});
